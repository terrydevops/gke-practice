###
# A placeholder that asks for more CPU than any node has free, so it stays
# Pending until the cluster autoscaler adds a node. It runs nothing (pause).
# Delete it and the autoscaler removes the extra node again, after about ten
# minutes of it sitting idle.
###
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-out-balloon
  namespace: chaos-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale-out-balloon
  template:
    metadata:
      labels:
        app: scale-out-balloon
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: { cpu: 1000m, memory: 64Mi } # a node has about 600m free
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
