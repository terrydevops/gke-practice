###
# Lightning on regtest: one bitcoind and two Core Lightning nodes (alice, bob)
# with a channel between them. A chain workload like esplora: platform-owned,
# stateful, slow to restart.
#
# Pod Security `restricted`, unlike esplora: every container here runs as
# non-root with a read-only root filesystem, no capabilities and the runtime's
# seccomp profile. Each process writes only to its mounted disk and /tmp.
###
apiVersion: v1
kind: Namespace
metadata:
  name: lightning
  labels:
    workload-class: chain
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
