###
# The bitcoind RPC password, from Secret Manager (bootstrap/ci/secrets.tf,
# `lightning-bitcoind-rpc`), read by lightning-secrets only, as for Grafana
# and cloudflared. bitcoind and the CLN nodes take it from the same Secret.
###
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightning-secrets
  namespace: lightning
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: lightning
spec:
  provider:
    gcpsm:
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: lightning-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bitcoind-rpc
  namespace: lightning
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: bitcoind-rpc
  data:
    - secretKey: password
      remoteRef:
        key: lightning-bitcoind-rpc
