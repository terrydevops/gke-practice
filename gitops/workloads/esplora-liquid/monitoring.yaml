###
# Prometheus (monitoring) picks up monitors and rules from every namespace
# (serviceMonitorSelectorNilUsesHelmValues: false in kube-prometheus-stack.yaml).
# Two endpoints: electrs' own metrics (:4224) and the chain metrics of
# components/chainwatch (:9101). Names: blockstream/prep/electrs-metrics.md.
###
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: electrs
  namespace: esplora-liquid
spec:
  # electrs answers /metrics with no Content-Type, which Prometheus 3 refuses
  # ("non-compliant scrape target"). Seen on the cluster, 2026-10-29.
  fallbackScrapeProtocol: PrometheusText0.0.4
  selector:
    matchLabels:
      app: esplora
  endpoints:
    - port: metrics
      interval: 30s
    - port: chain-metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: esplora
  namespace: esplora-liquid
spec:
  groups:
    - name: esplora-liquid
      rules:
        # electrs itself
        - alert: ElectrsMainLoopStalled
          expr: changes(electrs_main_loop_count{namespace="esplora-liquid"}[5m]) == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: electrs main loop has not advanced for 5 minutes"
        - alert: ElectrsRocksDBWriteStopped
          expr: max(rocksdb_is_write_stopped{namespace="esplora-liquid"}) > 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "liquid-regtest: RocksDB has stopped writes in the electrs index"
        - alert: ElectrsIndexBehind
          expr: max(chain_blocks{namespace="esplora-liquid"}) - max(tip_height{namespace="esplora-liquid"}) > 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: electrs is more than one block behind its node"
        # the node and the API in front of it
        - alert: ChainRPCDown
          expr: max(chain_rpc_up{namespace="esplora-liquid"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "liquid-regtest: the node does not answer RPC"
        - alert: ChainAPIDown
          expr: max(chain_api_up{namespace="esplora-liquid"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "liquid-regtest: the REST API does not answer"
        - alert: ChainAPIBehind
          expr: max(chain_blocks{namespace="esplora-liquid"}) - max(chain_api_tip_height{namespace="esplora-liquid"}) > 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: the API serves a tip more than one block old"
        - alert: ChainHeadersAhead
          expr: max(chain_headers{namespace="esplora-liquid"}) - max(chain_blocks{namespace="esplora-liquid"}) > 2
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: the node knows of blocks it has not validated"
        - alert: ChainwatchStale
          expr: time() - max(chainwatch_last_run_timestamp_seconds{namespace="esplora-liquid"}) > 120 or absent(chainwatch_last_run_timestamp_seconds{namespace="esplora-liquid"})
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: chain metrics are stale; the alerts below cannot be trusted"
        # The signal Liquid's monitoring raised at 14:10 UTC on 2026-09-06, four
        # hours before the network was halted. Blocks come every minute here.
        - alert: BlockProductionStalled
          expr: time() - max(chain_tip_timestamp_seconds{namespace="esplora-liquid"}) > 300
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "liquid-regtest: no new block for more than 300 seconds"
            runbook: docs/esplora-explorer.md#runbook-block-production-stalled
        - alert: ChainMempoolNearFull
          expr: max(chain_mempool_usage_bytes{namespace="esplora-liquid"} / chain_mempool_max_bytes{namespace="esplora-liquid"}) > 0.8
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: mempool above 80% of maxmempool"
        # Outflow: an explicit output above 100 coins in the tip block. Liquid's
        # blinded outputs carry no visible amount and cannot be checked this way.
        - alert: ChainLargeOutput
          expr: max(chain_largest_output_tip_block_sats{namespace="esplora-liquid"}) > 10000000000
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: an output above 100 coins in the latest block"
            runbook: docs/esplora-explorer.md#runbook-unusual-outflow
        - alert: ChainVolumeFillingUp
          expr: predict_linear(kubelet_volume_stats_available_bytes{namespace="esplora-liquid"}[6h], 3 * 86400) < 0
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: the data volume fills within three days at this rate"
        # Supply. On this regtest chain the native asset was issued once, at
        # genesis; any change in issued or burned amount is unexpected. Inflation
        # hidden in blinded outputs (the September 2026 bug) does not show here.
        - alert: LiquidNativeSupplyChanged
          expr: changes(chain_native_asset_issued_amount{namespace="esplora-liquid"}[15m]) > 0
          labels: { severity: critical }
          annotations:
            summary: "liquid-regtest: the issued amount of the native asset changed"
            runbook: docs/esplora-explorer.md#runbook-unusual-outflow
        - alert: LiquidNativeBurned
          expr: increase(chain_native_asset_burned_amount{namespace="esplora-liquid"}[1h]) > 0
          labels: { severity: warning }
          annotations:
            summary: "liquid-regtest: native asset burned (a peg-out or a burn) in the last hour"
            runbook: docs/esplora-explorer.md#runbook-unusual-outflow
