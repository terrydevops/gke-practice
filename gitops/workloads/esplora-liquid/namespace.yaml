###
# Chain workload, like gitops/workloads/esplora: platform-owned, Pod Security
# baseline (the image runs runit as root), warn and audit at restricted.
###
apiVersion: v1
kind: Namespace
metadata:
  name: esplora-liquid
  labels:
    workload-class: chain
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
