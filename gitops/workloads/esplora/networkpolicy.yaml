###
# Same baseline as a tenant namespace: nothing reaches the pod until opened.
# The only opening is Prometheus scraping electrs' metrics. The UI, the REST
# API and Electrum stay closed; reach them with kubectl port-forward.
###
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: esplora
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-metrics
  namespace: esplora
spec:
  podSelector:
    matchLabels:
      app: esplora
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 4224
