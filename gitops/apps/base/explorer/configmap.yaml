###
# One origin for the browser: the prebuilt UIs ask for /regtest/api and
# /liquidregtest/api (relative, fixed at build time), so nginx serves the files
# and forwards those paths to the two chain workloads. GET only (nginx lets HEAD through with it;
# electrs answers HEAD with 404): the public path has no way to broadcast.
# Checked against the image locally: / links both chains, deep links fall back to
# index.html, the API answers, POST gets 403.
###
apiVersion: v1
kind: ConfigMap
metadata:
  name: explorer-nginx
data:
  default.conf: |
    server {
      listen 8080;

      # The prebuilt UIs have no network menu (that needs MENU_ITEMS at build
      # time), so the root page links the two.
      location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Regtest explorers</title><body style="font-family:sans-serif;max-width:32rem;margin:4rem auto"><h1>Regtest explorers</h1><p>Practice chains on a GKE lab. Coins have no value.</p><ul><li><a href="/regtest/">Bitcoin regtest</a></li><li><a href="/liquidregtest/">Liquid regtest</a></li></ul></body>';
      }

      location /regtest/api/ {
        limit_except GET {
          deny all;
        }
        proxy_pass http://esplora.esplora.svc.cluster.local/regtest/api/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /regtest/ {
        root /site;
        try_files $uri /regtest/index.html; # a single-page app
      }

      location /liquidregtest/api/ {
        limit_except GET {
          deny all;
        }
        proxy_pass http://esplora.esplora-liquid.svc.cluster.local/liquidregtest/api/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /liquidregtest/ {
        root /site;
        try_files $uri /liquidregtest/index.html;
      }
    }
