###
# One origin for the browser: the prebuilt regtest UI asks for /regtest/api
# (relative, fixed at build time), so nginx serves the files and forwards that
# path to the esplora chain workload. GET only (nginx lets HEAD through with it;
# electrs answers HEAD with 404): the public path has no way to broadcast.
# Checked against the image locally: / redirects, deep links fall back to
# index.html, the API answers, POST gets 403.
###
apiVersion: v1
kind: ConfigMap
metadata:
  name: explorer-nginx
data:
  default.conf: |
    server {
      listen 8080;

      location = / {
        return 302 /regtest/;
      }

      location /regtest/api/ {
        limit_except GET {
          deny all;
        }
        proxy_pass http://esplora.esplora.svc.cluster.local/regtest/api/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /regtest/ {
        root /site;
        try_files $uri /regtest/index.html; # a single-page app
      }
    }
