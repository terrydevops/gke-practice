apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Tenant-owned. The namespace, its quota and default-deny come from the
# platform (gitops/tenants/base); Flux applies this as the tenant's own account
# and forces everything into whoami-staging-app.
namespace: whoami-staging-app
resources:
  - ../../base/whoami
replicas:
  - name: whoami
    count: 2
# Two replicas on one node are one reclaim away from zero. Staging insists on
# separate nodes; with a single node the second pod waits and the cluster
# autoscaler adds one. Dev keeps the soft rule: it has one replica.
patches:
  - target: { kind: Deployment, name: whoami }
    patch: |
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/1/whenUnsatisfiable
        value: DoNotSchedule
