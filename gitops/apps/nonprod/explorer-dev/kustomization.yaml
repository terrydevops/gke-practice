apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Tenant-owned. The namespace, its quota and default-deny come from the
# platform (gitops/tenants/base); Flux applies this as the tenant's own account
# and forces everything into explorer-dev-app.
namespace: explorer-dev-app
resources:
  - ../../base/explorer
