apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Tenant-owned. The namespace, its quota and default-deny come from the
# platform (gitops/tenants/base); Flux applies this as the tenant's own account
# and forces everything into whoami-dev-app.
namespace: whoami-dev-app
resources:
  - ../../base/whoami
replicas:
  - name: whoami
    count: 1
# TEMPORARY: a tag that does not exist, to see Flux report a failed commit
# status on GitHub. Reverted right after.
images:
  - name: docker.io/traefik/whoami
    newTag: v0.0.0-does-not-exist
