###
# Prometheus and Alertmanager (kube-prometheus-stack), plus the
# operator that turns PrometheusRule / ServiceMonitor objects into config.
# Same pattern as cloudnative-pg.yaml: the release lives in flux-system and runs
# as helm-controller; the workload lands in `monitoring`.
#
# GKE's own Managed Service for Prometheus (gmp-system) is left as it is: it
# has nothing to scrape, so it ingests nothing.
#
# No UI is exposed; see "Monitoring" in gitops/README.md for port-forward.
###
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter needs hostNetwork, hostPID and hostPath mounts
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  serviceAccountName: helm-controller
  targetNamespace: monitoring
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.3.0" # pinned; an upgrade is a reviewed change in git
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # GKE runs the control plane, and Dataplane V2 has no kube-proxy: these
    # cannot be scraped, and their rules would fire for ever.
    kubeScheduler: { enabled: false }
    kubeControllerManager: { enabled: false }
    kubeEtcd: { enabled: false }
    kubeProxy: { enabled: false }
    coreDns: { enabled: false } # GKE runs kube-dns
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
    prometheus:
      prometheusSpec:
        priorityClassName: platform-critical
        retention: 7d
        retentionSize: 8GB # below the volume size, so old data goes before the disk fills
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: standard-rwo # pd-balanced
              accessModes: [ReadWriteOnce]
              resources: { requests: { storage: 10Gi } }
        # the disk goes with the release; the default would leave it billing
        # after a teardown (gitops/README.md, "Tear down and rebuild")
        persistentVolumeClaimRetentionPolicy: { whenDeleted: Delete }
        # pick up rules, monitors and probes from every namespace, not only this release's
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        resources: { requests: { cpu: 100m, memory: 1Gi }, limits: { memory: 2Gi } } # uses about 60m
    alertmanager:
      alertmanagerSpec:
        priorityClassName: platform-critical
        # An AlertmanagerConfig in `monitoring` (infrastructure/alerting) routes
        # alerts from every namespace; elsewhere it would match only its own.
        alertmanagerConfigMatcherStrategy:
          type: OnNamespaceExceptForAlertmanagerNamespace
        # silences survive a restart (a Spot reclaim, for example)
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: standard-rwo
              accessModes: [ReadWriteOnce]
              resources: { requests: { storage: 1Gi } }
        persistentVolumeClaimRetentionPolicy: { whenDeleted: Delete }
        resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 128Mi } }
    grafana:
      # Grafana is its own release in infrastructure/configs/grafana.yaml: it
      # needs a Secret that only exists once the configs layer has run. The
      # datasource and dashboard ConfigMaps are still rendered here.
      enabled: false
      forceDeployDatasources: true
      forceDeployDashboards: true
    prometheusOperator:
      priorityClassName: platform-critical
      resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
    kube-state-metrics:
      priorityClassName: platform-critical
      resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 128Mi } }
      # Flux objects as metrics: gotk_resource_info, one series per object, with
      # its Ready status as a label. Alerts and the Flux dashboards read it
      # (infrastructure/configs/flux-monitoring.yaml). The default collectors
      # stay on: tenant alerts and the Esplora dashboard use them.
      # From fluxcd/flux2-monitoring-example, cut to the kinds this cluster runs.
      rbac:
        extraRules:
          - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
            resources: [gitrepositories, helmrepositories, helmcharts, ocirepositories, kustomizations, helmreleases]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
            - groupVersionKind: { group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: "The current state of a Flux Kustomization resource."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, lastAppliedRevision]
                    source_name: [spec, sourceRef, name]
            - groupVersionKind: { group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: "The current state of a Flux HelmRelease resource."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, history, "0", chartVersion]
                    chart_name: [status, history, "0", chartName]
                    chart_app_version: [status, history, "0", appVersion]
                    chart_ref_name: [spec, chartRef, name]
                    chart_source_name: [spec, chart, spec, sourceRef, name]
            - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: "The current state of a Flux GitRepository resource."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, artifact, revision]
                    url: [spec, url]
            - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: "The current state of a Flux HelmRepository resource."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, artifact, revision]
                    url: [spec, url]
            - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmChart }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: "The current state of a Flux HelmChart resource."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, artifact, revision]
                    chart_name: [spec, chart]
                    chart_version: [spec, version]
            - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository }
              metricNamePrefix: gotk
              metrics:
                - name: resource_info
                  help: "The current state of a Flux OCIRepository resource."
                  each:
                    type: Info
                    info:
                      labelsFromPath:
                        name: [metadata, name]
                  labelsFromPath:
                    exported_namespace: [metadata, namespace]
                    ready: [status, conditions, "[type=Ready]", status]
                    suspended: [spec, suspend]
                    revision: [status, artifact, revision]
                    url: [spec, url]
    prometheus-node-exporter:
      resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 64Mi } }
