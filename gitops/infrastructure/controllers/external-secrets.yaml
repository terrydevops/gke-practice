###
# External Secrets Operator: copies values from Google Secret Manager into
# Kubernetes Secrets. The stores and the secrets that use it are in
# infrastructure/configs/, next to the workloads that read them.
#
# Tenants get no ESO rights: the chart would otherwise add them to the
# admin/edit/view roles, and tenants hold `admin` in their namespace.
###
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  serviceAccountName: helm-controller
  targetNamespace: external-secrets
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "2.12.0" # pinned; an upgrade is a reviewed change in git
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    rbac:
      aggregateToView: false
      aggregateToEdit: false
      aggregateToAdmin: false
    resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 128Mi } }
    webhook:
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
    certController:
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
