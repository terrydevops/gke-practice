apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - tenant-guard.yaml
  - alerts.yaml
  - flux-commit-status.yaml
  - flux-monitoring.yaml
  - slo-whoami.yaml
  - slo-esplora.yaml
  - grafana-secret.yaml
  - grafana.yaml
# Dashboards: Grafana's sidecar loads ConfigMaps labelled grafana_dashboard=1,
# from the monitoring namespace only. The JSON stays a file so diffs read well.
# Flux substitution is off for it: Grafana's own ${datasource} is not a Flux
# variable, and strict mode would fail the whole layer on it.
configMapGenerator:
  - name: dashboard-esplora-chains
    namespace: monitoring
    files:
      - dashboards/esplora-chains.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  # Flux Cluster Stats and Flux Control Plane, as published in
  # fluxcd/flux2-monitoring-example (Apache-2.0), unchanged. They read the
  # metrics set up in flux-monitoring.yaml.
  - name: dashboard-flux-cluster
    namespace: monitoring
    files:
      - dashboards/flux-cluster.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: dashboard-flux-control-plane
    namespace: monitoring
    files:
      - dashboards/flux-control-plane.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
