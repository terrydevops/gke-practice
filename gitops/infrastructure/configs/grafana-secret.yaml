###
# Grafana's admin password, from Google Secret Manager.
#
# grafana-secrets is the only identity Secret Manager trusts for this secret
# (bootstrap/ci/secrets.tf binds it by namespace and name, through Workload
# Identity Federation). The store is namespaced, so an ExternalSecret elsewhere
# cannot use it. The project comes from the GKE metadata server.
###
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-secrets
  namespace: monitoring
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: monitoring
spec:
  provider:
    gcpsm:
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: grafana-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}" # ESO's template, not Flux's
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
