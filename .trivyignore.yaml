# Accepted IaC scan findings (docs/ci-standard.md T3). Each entry has a reason
# and an expiry; the weekly run fails once an entry expires.
misconfigurations:
  # Authorized networks guard the control plane's IP endpoints. Both are off
  # (modules/cluster/main.tf, control_plane_endpoints_config): the only way in
  # is the DNS endpoint, authorised by IAM, then RBAC.
  - id: GCP-0061
    paths:
      - modules/cluster/main.tf
    statement: IP endpoints disabled, DNS endpoint only
    expired_at: 2027-04-25
  # The public Esplora image writes at start: run.sh generates its runit
  # services under /etc/runit, and runit, nginx and tor keep state in /run and
  # /var. A read-only root would need an emptyDir per path and an init
  # container to seed /etc/runit. The namespace already runs it at `baseline`
  # for the same reason (gitops/workloads/esplora/namespace.yaml).
  - id: KSV-0014
    paths:
      - gitops/workloads/esplora/statefulset.yaml
      - gitops/workloads/esplora-liquid/statefulset.yaml
    statement: public Esplora image writes runit, nginx and tor state under /etc, /run and /var at start
    expired_at: 2027-04-29
