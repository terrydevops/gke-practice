###
# Security and hygiene gate, the baseline of docs/ci-standard.md: workflow
# lint and audit, YAML and shell lint, English-only check, secret scan,
# Terraform lint and IaC misconfiguration scan. No GCP or cluster access.
#
# Tools are pinned: actions to commit shas, images to digests, downloads to
# sha256, Python tools to a version. The weekly run catches new advisories
# and expired entries in .trivyignore.yaml; the pins do not move by themselves
# (dependabot does that).
###
name: security

on:
  push:
  schedule:
    - cron: "23 4 * * 1" # Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  # ECR mirror first: ghcr rate-limits anonymous database pulls
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_VERSION: v0.75.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        run: pipx run zizmor==1.30.0 --persona regular .github/workflows
      - name: yamllint
        run: pipx run yamllint==1.38.0 --strict .
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -S warning
      - name: English only
        run: .github/scripts/hygiene.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TFLINT_VERSION: v0.64.0
      TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tflint
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip" -o tflint.zip
          printf '%s  %s\n' "$TFLINT_SHA256" tflint.zip | sha256sum -c -
          unzip -q tflint.zip -d bin
          echo "$PWD/bin" >> "$GITHUB_PATH"
      # The token only raises the GitHub API rate limit for the plugin download;
      # the plugin version is pinned in .tflint.hcl.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          for d in bootstrap/state bootstrap/ci envs/nonprod modules/network modules/cluster; do
            echo "== $d"
            tflint --chdir="$d" --config="$PWD/.tflint.hcl"
          done
      # gotk-components.yaml is Flux's own install, generated by `flux bootstrap`:
      # its controllers need the wide ClusterRoles the scan reports.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          skip-files: gitops/clusters/nonprod/flux-system/gotk-components.yaml
          severity: HIGH,CRITICAL
          exit-code: "1"
