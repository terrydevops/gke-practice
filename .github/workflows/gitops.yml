###
# Render what Flux would render, then check every object against its schema:
# Kubernetes 1.36 for built-in kinds, the Flux release's own schemas for
# Kustomization / HelmRelease / sources, and the datreeio CRDs-catalog (pinned
# to a commit) for other CRDs such as PrometheusRule. -strict also rejects unknown fields,
# so a misspelt key fails here instead of being dropped by the API server.
# No GCP or cluster access.
#
# Then the postBuild substitution: every ${...} that a Kustomization with
# postBuild renders must have a variable or a default, as Flux's strict mode
# requires (.github/scripts/check-flux-substitution.py).
#
# Not checked: the values themselves (Flux substitutes them in the cluster), Helm chart
# contents (helm-controller renders those), and the CRDs in gotk-components.yaml
# (generated by `flux install`; the Kubernetes schema set has no CRD schema).
###
name: gitops

on:
  push:
    paths:
      - gitops/**
      - .github/workflows/gitops.yml
      - .github/scripts/check-flux-substitution.py

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBERNETES_VERSION: "1.36.4" # the cluster's version
      KUSTOMIZE_VERSION: v5.8.2
      KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      FLUX_VERSION: "2.9.3" # same as gotk-components.yaml
      FLUX_SCHEMAS_SHA256: 91a555810a37a61b021d0a7334d5623783d267a7ecbbff7d5a00e8c7df9c0d33
      CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/6e340600b8bfce7a453522e14b4d10f3c74cdc16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kustomize, kubeconform and the Flux schemas
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o kustomize.tgz
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o kubeconform.tgz
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/crd-schemas.tar.gz" -o flux-schemas.tgz
          printf '%s  %s\n' \
            "$KUSTOMIZE_SHA256" kustomize.tgz \
            "$KUBECONFORM_SHA256" kubeconform.tgz \
            "$FLUX_SCHEMAS_SHA256" flux-schemas.tgz | sha256sum -c -
          mkdir bin flux-schemas
          tar -xzf kustomize.tgz -C bin kustomize
          tar -xzf kubeconform.tgz -C bin kubeconform
          tar -xzf flux-schemas.tgz -C flux-schemas
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Render and check
        run: |
          kc() {
            kubeconform -strict -summary -skip CustomResourceDefinition \
              -kubernetes-version "$KUBERNETES_VERSION" \
              -schema-location default \
              -schema-location "$RUNNER_TEMP/flux-schemas/{{.ResourceKind}}{{.KindSuffix}}.json" \
              -schema-location "$CRDS_CATALOG/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" "$@"
          }
          failed=""
          out="$RUNNER_TEMP/out.yaml"
          # Every kustomize directory, rendered the way kustomize-controller does.
          # Built to a file first: a failed build piped straight in would look like
          # an empty, valid stream.
          for k in $(find gitops -name kustomization.yaml | sort); do
            d=$(dirname "$k")
            echo "== $d"
            if kustomize build "$d" > "$out" && kc "$out"; then :; else failed="$failed $d"; fi
          done
          # A cluster directory has no kustomization.yaml (Flux generates one), so
          # its files are checked as they are.
          for d in gitops/clusters/*/; do
            echo "== $d*.yaml"
            kc "$d"*.yaml || failed="$failed $d"
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
      - name: Check postBuild substitution
        run: |
          python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y -q python3-yaml
          for d in gitops/clusters/*/; do
            python3 .github/scripts/check-flux-substitution.py "$d"
          done
