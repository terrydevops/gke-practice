# Keeps the pins current (docs/ci-standard.md B3): action shas, and the
# provider versions in each root's .terraform.lock.hcl. A new release waits a
# week before it is proposed, so a compromised release has time to be pulled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories:
      - /bootstrap/state
      - /bootstrap/ci
      - /envs/nonprod
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Image tags and digests in the Kubernetes manifests. One entry per
  # directory that holds a manifest with a pinned image (not recursive).
  # Images in HelmRelease values (infrastructure/controllers) are not read.
  - package-ecosystem: docker
    directories:
      - /gitops/workloads/lightning
      - /gitops/workloads/lightning/cln
      - /gitops/workloads/esplora
      - /gitops/workloads/esplora-liquid
      - /gitops/workloads/cloudflared
      - /gitops/apps/base/explorer
      - /gitops/chaos/load
      - /gitops/infrastructure/configs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
